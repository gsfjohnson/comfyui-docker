upstream comfyui {
  server 127.0.0.1:8188;
}

server {
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name _;

  root /var/www/html/;
  index index.html;

  access_log /var/log/nginx/nginx_http_access.log combined;
  error_log /var/log/nginx/nginx_http_error.log;

  ssl_certificate /etc/ssl/certs/localhost.pem;
  ssl_certificate_key /etc/ssl/private/localhost.key;

  proxy_set_header Host $host;
  proxy_http_version 1.1;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
  proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
  proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "Upgrade";

  location / {
    auth_basic "Restricted";
    auth_basic_user_file /app/models/.htpasswd;
    proxy_pass http://comfyui$request_uri;
  }

}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  rewrite ^/(.*)$ https://$host:443/$1 redirect;
}

